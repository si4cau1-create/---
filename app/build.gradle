plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kadian.app'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.kadian.app"
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        debug {
            // 使用默认 debug 签名（~/.android/debug.keystore 不存在时由 Gradle 自动生成）
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            // 未配置自有签名时用 debug 签名，保证 assembleRelease 也能直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
